---
name: 🧪 Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLICOLOR_FORCE: 'true'

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - run: mise run test

  formatting:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Rustfmt Check
        run: mise run fmt
      - name: Run Clippy
        run: mise run lint

  build:
    name: cargo build
    needs: [test, formatting]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Build release
        run: mise run release
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build
          path: target/release/raytrace
          retention-days: 3

  render:
    name: render ${{ matrix.config }}
    needs: [build]
    strategy:
      matrix:
        config:
          - basic
          - cornell_box
          - sweet_dreams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: build
          path: target/release
      - run: chmod +x ./target/release/raytrace
      - env:
          CONFIG: ${{ matrix.config }}
        run: ./target/release/raytrace --config "examples/$CONFIG/render.toml" --output render.png --samples 100
      - uses: actions/upload-artifact@v7.0.1
        with:
            name: ${{ matrix.config }}-render
            path: render.png
            retention-days: 3
